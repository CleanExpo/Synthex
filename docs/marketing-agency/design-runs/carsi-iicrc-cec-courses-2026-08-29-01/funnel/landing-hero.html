@font-face{font-family:'Lora';src:url('file:///home/user/Synthex/public/fonts/carsi/Lora-Bold.woff2') format('woff2');font-weight:700;font-display:block}

*{margin:0;padding:0;box-sizing:border-box}

</style></head><body>
<header class="mark">CARSI</header>
<section class="field" id="field"></section>
<footer class="anchor">
  <h1 class="hook">Continuing education for technicians</h1>
  <p class="support">Courses for restoration technicians and technical inspectors, written to be worked through rather than skimmed.</p>
  <div class="meta"><span class="cta">See the courses</span></div>
</footer>
<script>
/* Tally field. Columns and rows are derived from the field's own box so the
   mark rhythm (76 x 96 px, the locked 1080x1440 cell) holds at every aspect
   ratio instead of nine rows collapsing into a smudge on short formats.
   At 1080x1440 the box is 984x868, which yields exactly 13 x 9 — the locked
   winner renders byte-identical. A box too short for one clean row hides the
   field's marks (keeping its grid space, so the anchor stays at the foot)
   and lets the rule carry the header.
   Skipped entirely when  was filled with real markup. */
(function(){
  var f=document.getElementById('field');
  if(f.children.length||f.textContent.trim()) return;
  var r=f.getBoundingClientRect();
  if(r.height<40){f.style.visibility='hidden';return;}
  var cl=function(v,lo,hi){return Math.max(lo,Math.min(hi,v));};
  var C=cl(Math.round(r.width/76),3,24), R=cl(Math.round(r.height/96),1,9), h='';
  f.style.gridTemplateColumns='repeat('+C+',1fr)';
  f.style.gridTemplateRows='repeat('+R+',1fr)';
  for(var y=1;y<=R;y++)for(var x=1;x<=C;x++){
    var on=((x-y)%7+7)%7===0;
    h+='<i style="grid-column:'+x+';grid-row:'+y+';opacity:'+(on?1:0.3)+'"></i>';
  }
  f.innerHTML=h;
})();
</script>

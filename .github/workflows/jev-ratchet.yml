name: JEV Ratchet

# Fails any diff that lowers a floor in tests/eval/jev/floors.json or deletes a case file
# without a tombstone entry. Reads a P1 proposal overlay when present (rule B2).

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ratchet:
    name: JEV ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          PROP=""
          if [ -f proposals/P1/tests/eval/jev/floors.json ]; then PROP="--proposal proposals/P1/tests/eval/jev/floors.json"; fi
          # Run the ratchet and its lib from the trusted BASE, with the PR as data, never the PR's
          # own copy: a PR could lower a floor and replace the script (verifier audit, second
          # pass). Same pattern as receipt-verify.yml and protected-paths.yml. The PR's copy only
          # while the base has none (bootstrap).
          R=scripts/jev/check-ratchet.mjs
          if git cat-file -e "$BASE_SHA:scripts/jev/check-ratchet.mjs" 2>/dev/null; then
            rm -rf /tmp/trusted && mkdir -p /tmp/trusted
            git archive "$BASE_SHA" scripts/jev scripts/fleet | tar -x -C /tmp/trusted
            R=/tmp/trusted/scripts/jev/check-ratchet.mjs
          else
            echo "NOTE bootstrap: base has no ratchet; using the PR's copy"
          fi
          node "$R" --base "$BASE_SHA" --head HEAD $PROP

name: Secret Scan (gitleaks)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action runs `gitleaks detect` with no --config. Point it at the
          # repo config so the living-card allowlist is the one that runs, and
          # the default rules stay on (useDefault = true in that file).
          GITLEAKS_CONFIG: .gitleaks.toml

name: Deploy

on:
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# Default least-privilege permissions; jobs override at job level when needed.
permissions: read-all

jobs:
  # -------------------------------------------------------
  # Test gate — must pass before any deploy
  # -------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Media asset gate
        run: npm run media:check
      - name: Upload media-gate debug artifact on failure
        if: failure()
        run: |
          # Re-run via the bounded debug wrapper that captures the failure
          # in .artifacts/media-gate-result.json. On CI, the artifact
          # path is uploaded to the GH Actions run for later inspection.
          node scripts/ci-debug-media-gate.mjs || true
          if [ -f .artifacts/media-gate-result.json ]; then
            mkdir -p media-gate-debug
            cp .artifacts/media-gate-result.json media-gate-debug/media-gate-result.json
          fi
      - name: Upload media-gate debug artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: media-gate-result
          path: media-gate-debug/media-gate-result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Unit tests
        # --passWithNoTests removed (WS1): the suite has 4000+ real tests, so the
        # flag only ever served to hide an accidentally-empty run. Dropping it
        # means an empty/misconfigured suite now fails the deploy gate instead of
        # passing silently. (--forceExit retained: jest.worktree.cjs sets it too,
        # to handle lingering open handles.)
        run: npm test -- --forceExit

  # -------------------------------------------------------
  # Deploy to staging (develop branch)
  # -------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      pull-requests: write # Required: github-script createComment for staging URL
    environment:
      name: staging
      url: https://staging.synthex.social
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel Environment
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Staging deployment ready: ${{ steps.deploy.outputs.url }}'
            })

  # -------------------------------------------------------
  # Deploy to production (main branch)
  # -------------------------------------------------------
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [test]
    # DEPLOY_INHIBIT is a central deploy kill-switch: set repo variable
    # DEPLOY_INHIBIT=true to freeze all production deploys without editing code.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_INHIBIT != 'true'
    # Human production approval is enforced by the `production` environment's
    # required reviewers (GitHub pauses this job for a human before it runs). The
    # approval is bound to this exact workflow run, i.e. commit ${{ github.sha }}.
    concurrency:
      group: synthex-production-deploy
      cancel-in-progress: false
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
    environment:
      name: production
      url: https://synthex.social
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ job.status }}"
          COLOR=$( [ "$STATUS" = "success" ] && echo "good" || echo "danger" )
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"attachments\":[{\"text\":\"Production deployment ${STATUS} for ${{ github.sha }}\",\"color\":\"${COLOR}\"}]}" || true

  # -------------------------------------------------------
  # Post-deploy: production smoke, BOUND TO THE DEPLOYED COMMIT
  # -------------------------------------------------------
  # Why this exists: until now nothing verified production after a deploy. The
  # only post-deploy job was Lighthouse, which is continue-on-error with an
  # `lhci assert ... || true`, so a deploy that shipped a broken site still
  # reported success. "Deployed" was never the same claim as "working".
  #
  # This job is deliberately NOT continue-on-error. If it cannot prove the
  # release is live and healthy, the workflow goes red.
  #
  # EXPECTED_GIT_SHA is the point. Without it, the smoke would happily pass
  # against the PREVIOUS release still being served - a green check proving
  # nothing about the commit that just deployed. Verified both ways before
  # wiring: with the true SHA the script exits 0 (8/8), and with a wrong SHA it
  # exits 1 naming the mismatch ("expected buildId deadbee, got 1ae76da").
  verify-production:
    name: Verify Production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Vercel returns from `deploy` before the production alias necessarily
      # serves the new build everywhere. Asserting immediately would race that
      # propagation and make this gate flaky - and a flaky required gate is how
      # `continue-on-error` gets added back. So wait for the release to actually
      # appear, with a bounded budget, and fail loudly if it never does.
      - name: Wait for the production alias to serve this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          short="${EXPECTED_SHA:0:7}"
          echo "Waiting for /api/health to report buildId ${short}"
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 https://synthex.social/api/health || true)
            got=$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).buildId||""))}catch{process.stdout.write("")}})')
            if [ "$got" = "$short" ]; then
              echo "Release ${short} is live after ${attempt} attempt(s)."
              exit 0
            fi
            echo "  attempt ${attempt}: serving '${got:-<unreadable>}', want '${short}'"
            sleep 10
          done
          echo "FAIL: production never served ${short} within the budget."
          echo "The deploy reported success but the release is not being served."
          exit 1

      - name: Public production smoke, bound to this release
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
          BASE_URL: https://synthex.social
        run: node scripts/verify-deployment.js

      # Complementary surface: verify-deployment.js covers health probes,
      # security headers and unauthenticated rejection; this covers the public
      # pages (/, /login, /pricing) that it does not.
      - name: Public page smoke
        env:
          BASE_URL: https://synthex.social
        run: node scripts/smoke-test.mjs

  # -------------------------------------------------------
  # Post-deploy: Lighthouse performance test
  # -------------------------------------------------------
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install @lhci/cli
        run: npm install -g @lhci/cli@0.14.x
      - name: Collect Lighthouse reports
        timeout-minutes: 10
        run: |
          lhci collect \
            --url="https://synthex.social/" \
            --url="https://synthex.social/login" \
            --url="https://synthex.social/dashboard" \
            --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage --headless=new"
        continue-on-error: true
      - name: Assert performance budgets
        run: lhci assert --config=config/lighthouserc.cjs || true
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: deploy-lighthouse-results-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30
          include-hidden-files: true

name: Protected Paths

# Fails any pull request that touches a protected path (scripts/fleet/policy.json) unless:
#   - the only protected change is the phase's own release-receipts/P<n>.json and
#     scripts/release/verify-receipt.mjs validates it, or ledger/manifest rows; or
#   - the PR carries the human-applied label `human-required`; or
#   - the bootstrap exemption holds (feature/fleet-p-1-* while policy.json is absent at the base).
# Written in Phase -1 of docs/superpowers/specs/2026-10-17-vibe-to-leader-design.md.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-paths:
    name: Protected paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Human-required label present?
        id: label
        run: |
          if echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q '"human-required"'; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify protected paths against the base
        if: steps.label.outputs.present != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "$HEAD_SHA"
          git checkout -q "$HEAD_SHA"
          # branch name arrives through the environment, never substituted into shell source
          git branch -f -- "$HEAD_REF" HEAD && git checkout -q -- "$HEAD_REF"
          # Run the verifier and policy from the trusted BASE, not from the PR under test; the PR's
          # own copy is used only while the base has none (bootstrap, exemption in the script).
          if git cat-file -e "$BASE_SHA:scripts/fleet/verify-protected.mjs" 2>/dev/null; then
            rm -rf /tmp/trusted && mkdir -p /tmp/trusted
            git archive "$BASE_SHA" scripts/fleet scripts/release | tar -x -C /tmp/trusted
            node /tmp/trusted/scripts/fleet/verify-protected.mjs --repo "$PWD" --base "$BASE_SHA" --head HEAD
          else
            echo "NOTE bootstrap: base has no verifier; using the PR's copy under the bootstrap exemption"
            node scripts/fleet/verify-protected.mjs --base "$BASE_SHA" --head HEAD
          fi
      - name: Label applied by a person
        if: steps.label.outputs.present == 'true'
        run: echo "human-required label present; protected change accepted as a waterline act"
